name: Bot Rastreo Estelar Express

on:
  schedule:
    # Colombia UTC-5 → 7AM=12UTC, 10AM=15UTC, 1PM=18UTC, 4PM=21UTC
    # Lunes a Sábado
    - cron: "0 12 * * 1-6"
    - cron: "0 15 * * 1-6"
    - cron: "0 18 * * 1-6"
    - cron: "0 21 * * 1-6"
  workflow_dispatch:

jobs:
  rastrear-guias:
    name: Rastrear guias Estelar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: ./bot
        run: npm install

      - name: Instalar Chromium
        working-directory: ./bot
        run: npx playwright install chromium --with-deps

      - name: Ejecutar bot
        working-directory: ./bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node estelar-bot.js

      - name: Resultado
        if: always()
        run: echo "Bot finalizado - ver logs arriba"
