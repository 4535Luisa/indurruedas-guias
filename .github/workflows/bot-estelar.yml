name: Bot Rastreo Estelar Express

on:
  schedule:
    - cron: "0 12 * * 1-6"
    - cron: "0 17 * * 1-6"
    - cron: "0 23 * * 1-6"
  workflow_dispatch:

jobs:
  rastrear-guias:
    name: Rastrear guias Estelar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias bot
        working-directory: ./bot
        run: npm install

      - name: Instalar Chromium
        working-directory: ./bot
        run: npx playwright install chromium --with-deps

      - name: Ejecutar bot
        working-directory: ./bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "SUPABASE_URL definida: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_KEY definida: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}"
          node estelar-bot.js

      - name: Notificar resultado
        if: always()
        run: echo "Bot finalizado"
